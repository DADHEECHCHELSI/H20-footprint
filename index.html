<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My H2O Footprint - Enhanced</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#081820;
    --ink-2:#0C222B;
    --card:#0F2A33;
    --card-edge: rgba(255,255,255,.07);
    --water:#4FC3D1;
    --water-deep:#1F7B8C;
    --clay:#E0965A;
    --clay-deep:#A85B2C;
    --sand:#F5ECDD;
    --sand-dim:#A9C4C6;
    --good:#57D38C;
    --avg:#F2CB4E;
    --high:#F0913F;
    --bad:#EF4F4F;
    --line: rgba(245,236,221,0.10);
    --accent: var(--water);
    --accent-deep: var(--water-deep);
    --accent-soft: rgba(79,195,209,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--sand);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79,195,209,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 10%, rgba(224,150,90,.10), transparent 60%),
      var(--ink);
    min-height:100vh;
  }
  body[data-theme="B"]{--accent:var(--clay); --accent-deep:var(--clay-deep); --accent-soft: rgba(224,150,90,.16);}
  body[data-theme="C"]{--accent:#6C8EEF; --accent-deep:#4A63C4; --accent-soft: rgba(108,142,239,.16);}

  svg.bg-ripples{position:fixed; inset:0; width:100%; height:100%; z-index:0; opacity:.35; pointer-events:none;}

  .app-shell{max-width:640px;margin:0 auto;min-height:100vh;padding:18px 20px 118px;position:relative;z-index:1;}

  .brand{display:flex; align-items:center; gap:9px; justify-content:center; margin-bottom:10px;}
  .brand-drop{width:20px;height:20px;flex:none;}
  .brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:15px; letter-spacing:.01em;
    background:linear-gradient(90deg, var(--water), var(--clay));
    -webkit-background-clip:text; background-clip:text; color:transparent;}

  /* ---------- Progress Pot ---------- */
  .pot-zone{display:flex;flex-direction:column;align-items:center;gap:5px;position:sticky;top:0;padding-bottom:8px;z-index:20;}
  .pot-svg{width:64px;height:76px;overflow:visible; filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));}
  .pot-body-outline{fill:none;stroke:var(--sand-dim);stroke-width:2;opacity:.5;transition:stroke .6s ease;}
  body[data-theme="B"] .pot-body-outline{stroke:var(--clay);}
  body[data-theme="C"] .pot-body-outline{stroke:#6C8EEF;}
  .wave-fill{fill:var(--water); transition:fill .6s ease;}
  body[data-theme="B"] .wave-fill{fill:var(--clay);}
  body[data-theme="C"] .wave-fill{fill:#6C8EEF;}
  .grain-dot{fill:var(--sand);opacity:0;transition:opacity .6s ease;}
  body[data-theme="B"] .grain-dot{opacity:.5;}
  .progress-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--sand-dim);text-transform:uppercase;}
  .progress-dots{display:flex;gap:4px;margin-top:1px;}
  .pdot{width:5px;height:5px;border-radius:50%;background:var(--line); transition:background .3s;}
  .pdot.on{background:var(--accent);}

  /* ---------- Card / stage ---------- */
  #stage{margin-top:4px;}
  .card{
    background:linear-gradient(165deg, var(--card), var(--ink-2));
    border:1px solid var(--card-edge);
    border-radius:24px;
    padding:26px 24px 22px;
    position:relative;
    animation:riseIn .45s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 30px 60px -32px rgba(0,0,0,.75);
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--water), var(--clay));
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px) scale(.985);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .icon-badge{
    width:46px;height:46px;border-radius:14px;flex:none;
    background:var(--accent-soft); border:1px solid var(--card-edge);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
  }
  .icon-badge svg{width:24px;height:24px;stroke:var(--accent); fill:none;}

  .inline-image{width:100%; max-width:280px; margin:16px auto; display:block; border-radius:16px;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.05), rgba(255,255,255,0) 70%);
    padding:6px;}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:10.5px;
    color:var(--accent);
    margin-bottom:8px;
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow .line{flex:1;height:1px;background:var(--line);}
  h1.title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    line-height:1.18;
    margin:0 0 8px;
  }
  .subtitle{color:var(--sand-dim); font-size:14px; line-height:1.55; margin-bottom:4px;}

  .part-block{margin-top:24px; padding-top:20px; border-top:1px dashed var(--line);}
  .part-block:first-of-type{margin-top:20px; padding-top:0; border-top:none;}
  .q-label{font-weight:600; font-size:14.5px; margin-bottom:11px;}

  .options{display:grid; gap:8px;}
  .option-tile{
    display:flex; align-items:center; gap:11px;
    padding:11px 13px; border-radius:13px;
    border:1.5px solid var(--line);
    background:rgba(255,255,255,.02);
    cursor:pointer; transition:all .18s ease; user-select:none;
  }
  .option-tile:hover{border-color:var(--accent); transform:translateY(-1px);}
  .option-tile.selected{border-color:var(--accent); background:var(--accent-soft);}
  .checkbox{
    width:20px; height:20px; border-radius:6px; flex:none;
    border:2px solid rgba(245,236,221,.32);
    display:flex; align-items:center; justify-content:center;
    transition:all .18s ease;
  }
  .option-tile.selected .checkbox{background:var(--accent); border-color:var(--accent);}
  .checkbox svg{width:11px; height:11px; opacity:0; transform:scale(.4); transition:all .18s ease;}
  .option-tile.selected .checkbox svg{opacity:1; transform:scale(1);}
  .opt-emoji{font-size:18px; flex:none; width:20px; text-align:center;}
  .opt-label{flex:1; font-size:13.5px; line-height:1.35;}
  .opt-zero{opacity:.75; font-style:italic;}

  /* ---------- reference gauge ---------- */
  .gauge-wrap{margin-top:16px; padding:14px 14px 12px; background:rgba(0,0,0,.16); border-radius:14px; border:1px solid var(--card-edge);}
  .gauge-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--sand-dim); font-family:'JetBrains Mono',monospace; margin-bottom:9px; display:flex; justify-content:space-between;}
  .gauge-track{position:relative; height:9px; border-radius:6px;
    background:linear-gradient(90deg, var(--good) 0%, var(--good) 15%, var(--avg) 45%, var(--high) 72%, var(--bad) 100%);
  }
  .gauge-marker{
    position:absolute; top:-5px; width:2px; height:19px; background:var(--sand);
    transform:translateX(-1px); transition:left .35s cubic-bezier(.2,.8,.2,1); border-radius:2px;
    box-shadow:0 0 0 3px rgba(255,255,255,.15);
  }
  .gauge-ends{display:flex; justify-content:space-between; font-size:10px; color:var(--sand-dim); margin-top:6px;}
  .impact-line{margin-top:11px; font-size:13px; line-height:1.5; color:var(--sand); min-height:20px;}
  .impact-line b{color:var(--accent);}
  .impact-placeholder{color:var(--sand-dim); font-style:italic;}

  .info-box{background:rgba(79,195,209,.08); border-left:4px solid var(--water); padding:12px 14px; border-radius:8px; font-size:13px; line-height:1.5; margin:12px 0;}
  .info-box.alert{background:rgba(239,79,79,.08); border-left-color:#EF4F4F;}
  .info-box.note{background:rgba(87,211,140,.08); border-left-color:#57D38C;}

  .comparison-card{background:rgba(255,255,255,.04); border:1px solid var(--card-edge); border-radius:12px; padding:14px; margin:10px 0;}
  .comparison-card-label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--sand-dim); margin-bottom:6px;}
  .comparison-card-value{font-size:18px; font-weight:700; color:var(--accent); font-family:'JetBrains Mono',monospace;}

  /* ---------- nav ---------- */
  .nav{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    padding:14px 20px 20px;
    background:linear-gradient(180deg, transparent, var(--ink) 46%);
    z-index:30;
  }
  .nav-inner{max-width:640px; width:100%; display:flex; gap:10px;}
  .btn{
    flex:1; padding:13px 18px; border-radius:13px; border:none;
    font-family:'Work Sans',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; transition:all .15s ease;
  }
  .btn-back{background:transparent; color:var(--sand-dim); border:1.5px solid var(--line);}
  .btn-back:hover{border-color:var(--sand-dim); color:var(--sand);}
  .btn-next{background:linear-gradient(90deg, var(--water), var(--accent)); color:#062026; box-shadow:0 10px 26px -10px var(--accent-deep); font-weight:700;}
  .btn-next:disabled{opacity:.3; cursor:not-allowed; box-shadow:none;}
  .btn-next:not(:disabled):hover{filter:brightness(1.07); transform:translateY(-1px);}

  /* intro */
  .intro-hero{display:flex; justify-content:center; margin-bottom:8px;}
  .intro-hero svg{width:78px; height:78px;}
  .intro-story{font-size:14.5px; line-height:1.7; color:var(--sand-dim); margin:6px 0 16px;}
  .intro-story em{color:var(--sand); font-style:normal; font-weight:600;}
  .intro-nudge{font-size:12.5px; color:var(--accent); display:flex; align-items:center; gap:6px;}

  /* results */
  .score-wrap{margin-top:6px;}
  .score-badge{display:flex; align-items:center; gap:14px;}
  .score-num{font-family:'Fraunces',serif; font-size:46px; font-weight:700; line-height:1;}
  .score-of{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--sand-dim);}
  .score-word{display:inline-block; padding:4px 11px; border-radius:100px; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-top:4px;}

  .big-gauge{margin-top:16px;}
  .big-gauge-track{position:relative; height:16px; border-radius:10px;
    background:linear-gradient(90deg, var(--good) 0%, var(--good) 12%, var(--avg) 40%, var(--high) 68%, var(--bad) 92%, var(--bad) 100%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.3);
  }
  .big-gauge-marker{position:absolute; top:-7px; width:3px; height:30px; background:#fff; border-radius:3px; box-shadow:0 0 0 4px rgba(255,255,255,.18), 0 4px 10px rgba(0,0,0,.4); transition:left 1s cubic-bezier(.2,.8,.2,1);}
  .big-gauge-scale{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--sand-dim); margin-top:8px;}

  .totals-row{display:flex; gap:10px; margin-top:20px;}
  .total-card{flex:1; padding:14px; border-radius:14px; background:rgba(255,255,255,.03); border:1px solid var(--card-edge); text-align:center;}
  .total-card .t-label{font-size:11px; color:var(--sand-dim); margin-bottom:6px;}
  .total-card .t-value{font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700; color:var(--accent);}
  .total-card .t-emoji{font-size:18px;}

  .tips{margin-top:20px; display:grid; gap:9px;}
  .tips-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--sand-dim); font-family:'JetBrains Mono',monospace; margin-bottom:2px;}
  .tip{
    display:flex; gap:9px; padding:11px 13px; border-radius:12px;
    background:rgba(255,255,255,.03); border-left:3px solid var(--accent); font-size:13px; line-height:1.5;
  }
  .restart-btn{margin-top:18px; width:100%;}

  /* ---------- rotate hint (portrait phones) ---------- */
  .rotate-hint{display:none; position:fixed; inset:0; z-index:100; background:rgba(4,14,18,.94);
    flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; gap:12px;}
  .rotate-hint svg{width:52px;height:52px; animation:rotatePulse 1.6s ease-in-out infinite;}
  @keyframes rotatePulse{0%,100%{transform:rotate(0deg);} 50%{transform:rotate(90deg);}}
  .rotate-hint h2{font-family:'Fraunces',serif; font-size:19px; margin:0;}
  .rotate-hint p{font-size:13px; color:var(--sand-dim); margin:0; max-width:280px;}

  @media (orientation:portrait) and (max-width:900px) and (pointer:coarse){
    .rotate-hint{display:flex;}
  }

  /* ---------- landscape phone layout ---------- */
  @media (orientation:landscape) and (max-height:560px){
    body{overflow:hidden;}
    .app-shell{
      max-width:none; height:100vh; padding:12px 16px 12px 12px;
      display:flex; flex-direction:row; align-items:stretch; gap:14px;
    }
    .brand{flex-direction:column; margin-bottom:8px;}
    .pot-zone{
      position:static; flex:0 0 92px; display:flex; flex-direction:column;
      justify-content:center; align-items:center; padding-bottom:0; height:100%;
      border-right:1px dashed var(--line); padding-right:12px;
    }
    .pot-svg{width:52px;height:62px;}
    #stage{flex:1; overflow-y:auto; height:100%; padding-bottom:74px; padding-right:2px;}
    .card{padding:18px 20px 16px;}
    h1.title{font-size:19px;}
    .subtitle{font-size:12.5px;}
    .nav{left:auto; right:16px; bottom:10px; padding:0; background:none; width:calc(100% - 120px); max-width:420px;}
    .nav-inner{gap:8px;}
    .btn{padding:11px 14px; font-size:13px;}
  }

  @media (max-width:400px){
    h1.title{font-size:21px;}
    .score-num{font-size:38px;}
  }
</style>
</head>
<body data-theme="A">

<svg class="bg-ripples" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <circle cx="60" cy="120" r="140" fill="none" stroke="rgba(79,195,209,.18)" stroke-width="1"/>
  <circle cx="340" cy="620" r="180" fill="none" stroke="rgba(224,150,90,.14)" stroke-width="1"/>
  <circle cx="200" cy="400" r="260" fill="none" stroke="rgba(79,195,209,.08)" stroke-width="1"/>
</svg>

<div class="rotate-hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="#4FC3D1" stroke-width="1.6"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></svg>
  <h2>Turn your phone sideways 📱↻</h2>
  <p>My H2O Footprint flows best in landscape. Rotate your device to continue.</p>
</div>

<div class="app-shell">

  <div class="pot-zone">
    <div class="brand">
      <svg class="brand-drop" viewBox="0 0 24 24"><path d="M12 2C12 2 5 11 5 16a7 7 0 0 0 14 0C19 11 12 2 12 2Z" fill="#4FC3D1"/></svg>
      <span class="brand-name">My H2O Footprint</span>
    </div>
    <svg class="pot-svg" viewBox="0 0 80 96">
      <defs>
        <clipPath id="potClip">
          <path d="M22 8 H58 V20 C58 20 70 34 70 56 C70 78 56 90 40 90 C24 90 10 78 10 56 C10 34 22 20 22 20 Z"/>
        </clipPath>
      </defs>
      <path class="pot-body-outline" d="M22 8 H58 V20 C58 20 70 34 70 56 C70 78 56 90 40 90 C24 90 10 78 10 56 C10 34 22 20 22 20 Z"/>
      <rect x="20" y="4" width="40" height="7" rx="3" fill="none" class="pot-body-outline"/>
      <g clip-path="url(#potClip)">
        <rect id="waterLevel" x="0" y="96" width="80" height="0" class="wave-fill"/>
        <circle class="grain-dot" cx="30" cy="70" r="1.6"/>
        <circle class="grain-dot" cx="46" cy="60" r="1.3"/>
        <circle class="grain-dot" cx="38" cy="80" r="1.5"/>
        <circle class="grain-dot" cx="52" cy="74" r="1.2"/>
        <circle class="grain-dot" cx="26" cy="58" r="1.1"/>
      </g>
    </svg>
    <div class="progress-label" id="progressLabel">STEP 1 / 16</div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <div id="stage"></div>
</div>

<div class="nav">
  <div class="nav-inner" id="navInner"></div>
</div>

<script>
/* ============ ICONS ============ */
const ICONS = {
  drop: `<path d="M12 2C12 2 5 11 5 16a7 7 0 0 0 14 0C19 11 12 2 12 2Z" stroke-width="1.6" stroke="currentColor"/>`,
  shower: `<path d="M4 12h13M6 12V8a4 4 0 0 1 8 0M8 16v1M11 16v1M14 16v1M8 19v1M11 19v1M14 19v1" stroke-linecap="round"/>`,
  toilet: `<path d="M6 4h9v6a4.5 4.5 0 0 1-4.5 4.5A4.5 4.5 0 0 1 6 10V4Z"/><path d="M8 14.5V17a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2v-2M6 8h9"/>`,
  washer: `<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="5"/><circle cx="7" cy="6" r="1"/>`,
  sink: `<path d="M3 10h18M5 10v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6M12 10V5M12 5c0-1 1-2 2-2"/>`,
  broom: `<path d="M14 3 6 20M5 20h6M9 15l7-9 3 2-8 9-4 1 2-3Z"/>`,
  leak: `<path d="M12 2s5 6.5 5 10.5A5 5 0 0 1 7 12.5C7 8.5 12 2 12 2Z"/><path d="M12 21v-3"/>`,
  shirt: `<path d="M8 3 4 6l2 3 2-1v11h8V8l2 1 2-3-4-3-2 2h-4L8 3Z"/>`,
  plug: `<path d="M9 3v5M15 3v5M6 8h12v4a6 6 0 0 1-12 0V8ZM12 18v3"/>`,
  wifi: `<path d="M3 8.5a15 15 0 0 1 18 0M6.5 12a10 10 0 0 1 11 0M10 15.5a5 5 0 0 1 4 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>`,
  food: `<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>`,
  globe: `<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>`,
  leaf: `<path d="M12 2c-1 0-2 1-2 2v8c0 1 1 2 2 2s2-1 2-2V4c0-1-1-2-2-2zm-4 6c-.5 0-1 .5-1 1 0 3 2 6 4 7.5 2-1.5 4-4.5 4-7.5 0-.5-.5-1-1-1h-6z"/>`,
  water_drop: `<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.32 0z"/>`,
};
function icon(name){ return `<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`; }
function checkIcon(){
  return '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#062026" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

/* ============ IMAGES AS SVG (original, colorful, face-free flat illustrations) ============ */
/* Shared gradient/def library injected once, reused by every illustration below */
const IMG_DEFS = `
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6FE0EC"/><stop offset="100%" stop-color="#1F7B8C"/></linearGradient>
  <linearGradient id="gClay" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F4B27C"/><stop offset="100%" stop-color="#A85B2C"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8CF0B8"/><stop offset="100%" stop-color="#2FA968"/></linearGradient>
  <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FCE28C"/><stop offset="100%" stop-color="#E8B93A"/></linearGradient>
  <linearGradient id="gPink" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFA6C4"/><stop offset="100%" stop-color="#E85E8A"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C3AEF7"/><stop offset="100%" stop-color="#7C5CD6"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FF9B9B"/><stop offset="100%" stop-color="#D6413F"/></linearGradient>
  <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B9C7D6"/><stop offset="100%" stop-color="#5C7183"/></linearGradient>
`;
function imgWrap(viewBox, inner){
  return `<svg class="inline-image" viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg"><defs>${IMG_DEFS}</defs>${inner}</svg>`;
}

/* Intro — a small colorful world with an orbiting droplet cycle */

/* ============ DATA ============ */
function withZero(options, zeroLabel){
  const hasZero = options.some(o => o.value === 0);
  if(hasZero) return options;
  return [...options, {label: zeroLabel || "No — I don't use water here", emoji:"🚫", value:0, zero:true}];
}

  { id:"electricity", type:"question", theme:"B", part:"Hidden Water", icon:"plug",

    parts:[
      { q:"How much AC / appliance use per day?", options: withZero([
          {label:"Low usage, minimal AC", emoji:"🌤️", value:30},

  { id:"india-context", type:"info-slide", theme:"C",

    subtitle:"Understanding the context", 
    image:indiaImage,
    content:`
      <div class="info-box alert">
        <strong>⚠️ Critical Facts:</strong> India has 18% of world's population but only 4% of fresh water. Ranks 120 out of 122 nations for water quality, 133 out of 180 for availability.

      <div class="comparison-card">
        <div class="comparison-card-label">Urban Domestic Standard</div>

        <div class="comparison-card-label">Rural Domestic Standard</div>

        <strong>📊 Global Context:</strong> India's total water footprint is 1,182 cu. km/year (largest globally with China & US). Agriculture accounts for 92% of this, followed by industry & domestic.

    `
  },

  { id:"india-daily", type:"info-slide", theme:"C",
    title:"What Should You Use Daily?",
    subtitle:"India's recommendation", 
    image:dropletChain,
    content:`
      <div class="comparison-card">
        <div class="comparison-card-label">✅ Efficient & Sustainable</div>

        <div class="comparison-card-label">📊 Average (Urban)</div>

      <div class="comparison-card">
        <div class="comparison-card-label">⚠️ High (Wasteful)</div>

      <div class="info-box">
        <strong>Breakdown of 135L standard:</strong><br>
        🚽 Toilet: 45L | 🛁 Bathing: 20L | 🧺 Laundry: 40L<br>
        🚰 Kitchen: 7L | 🧹 Cleaning: 10L | 💧 Other: 13L
      </div>
      <div class="info-box note">
        <strong>🌱 Goal for India:</strong> Reduce direct use to 100L/day while optimizing food & energy choices to cut virtual water consumption.

];

/* ============ STATE ============ */
let current = 0;
const answers = {};
let familySize = 1;

const stage = document.getElementById("stage");
const navInner = document.getElementById("navInner");
const progressLabel = document.getElementById("progressLabel");
const progressDots = document.getElementById("progressDots");
const waterLevel = document.getElementById("waterLevel");

/* ============ RENDER ============ */
function render(){
  const screen = SCREENS[current];
  document.body.setAttribute("data-theme", screen.theme === "B" ? "B" : screen.theme === "C" ? "C" : "A");

  const pct = current / (SCREENS.length - 1);
  const fillH = 86 * pct;
  waterLevel.setAttribute("y", 96 - fillH);
  waterLevel.setAttribute("height", fillH);
  progressLabel.textContent = `STEP ${current+1} / ${SCREENS.length}`;
  progressDots.innerHTML = SCREENS.map((_,i)=>`<div class="pdot ${i<=current?'on':''}"></div>`).join("");

  let html = "";
  if(screen.type === "intro") html = renderIntro();
  else if(screen.type === "family") html = renderFamily();
  else if(screen.type === "question") html = renderQuestion(screen);
  else if(screen.type === "info-slide") html = renderInfoSlide(screen);
  else if(screen.type === "results") html = renderResults();

  stage.innerHTML = `<div class="card">${html}</div>`;
  renderNav(screen);
  attachHandlers(screen);
}

function renderIntro(){
  return `
    ${introImage()}
    <h1 class="title" style="text-align:center;">My H2O Footprint</h1>
    <p class="intro-story" style="text-align:center;">Every shower, every load of laundry, every hour the lights stay on — quietly pulls from the same shrinking source. Some of that water you can see. Most of it, you never do.</p>
    <p class="intro-story" style="text-align:center;">India faces critical water scarcity. This survey helps you understand your true impact and find real solutions.</p>
    <p class="intro-story" style="text-align:center;"><em>About 5 minutes, all taps, no typing.</em></p>
  `;
}

function renderFamily(){
  const sizes = [1,2,3,4,5,"6+"];
  return `
    <div class="icon-badge">${icon('drop')}</div>
    <div class="eyebrow"><span>Before we begin</span><span class="line"></span><span>🏠</span></div>
    <h1 class="title">How many people share water in your home?</h1>
    <p class="subtitle">We'll use this to show your household's total, alongside your own number.</p>
    ${familyImage()}
    <div class="options" style="grid-template-columns:repeat(3,1fr); display:grid; margin-top:16px;">
      ${sizes.map(s=>`
        <div class="option-tile fam-tile ${familySize==s?'selected':''}" data-size="${s}" style="justify-content:center;">
          <div class="checkbox">${checkIcon()}</div>
          <div class="opt-label" style="text-align:center; flex:none;">${s}</div>
        </div>`).join("")}
    </div>
  `;
}

function bucketsOf(value){ return Math.round(value/15); }

function comparisonFor(screenId, value){
  if(value === 0) return `<span class="impact-placeholder">No extra water used here — nice. 🌟</span>`;
  if(["bathing","toilet","laundry","kitchen","cleaningOutdoor","leaks"].includes(screenId)){
    const b = bucketsOf(value);
    return `≈ <b>${value} L</b> — about <b>${b > 0 ? b : "less than 1"}</b> ${b===1?"bucket":"buckets"} of water (15 L each) 🪣`;
  }
  if(screenId === "diet"){
    const meals = Math.max(1, Math.round(value/150));
    return `≈ <b>${value} L/day</b> of hidden water in your food — like <b>${meals}</b> beef burger(s) worth 🍔`;
  }
  if(screenId === "clothing"){
    const shirts = Math.max(1, Math.round(value/90));
    return `≈ <b>${value} L/day</b> of hidden water woven into fabric — roughly <b>${shirts}</b> t-shirt-equivalent(s), spread across the month 👕`;
  }
  if(screenId === "electricity"){
    const kwh = Math.max(1, Math.round(value/2.8));
    return `≈ <b>${value} L/day</b> — the cooling water behind about <b>${kwh} kWh</b> of electricity ⚡`;
  }
  if(screenId === "digital"){
    return `≈ <b>${value} L/day</b> of cooling water quietly used by servers behind your streaming & AI use 📶`;
  }
  return `≈ <b>${value} L/day</b>`;
}

function renderQuestion(screen){
  answers[screen.id] = answers[screen.id] || screen.parts.map(p => p.multi ? [] : null);
  const partsHtml = screen.parts.map((p, pi) => {
    const selected = answers[screen.id][pi];
    const maxVal = Math.max(...p.options.map(o=>o.value), 1);

    const optsHtml = p.options.map((opt, oi) => {
      const isSel = p.multi
        ? (Array.isArray(selected) && selected.includes(oi))
        : selected === oi;
      return `
        <div class="option-tile ${isSel?'selected':''}" data-screen="${screen.id}" data-part="${pi}" data-opt="${oi}" data-multi="${p.multi?1:0}">
          <div class="checkbox">${checkIcon()}</div>
          <div class="opt-emoji">${opt.emoji}</div>
          <div class="opt-label ${opt.zero?'opt-zero':''}">${opt.label}</div>
        </div>`;
    }).join("");

    let markerPct = 0, impactHtml = `<span class="impact-placeholder">Pick an option to see your impact →</span>`;
    if(!p.multi && selected !== null && selected !== undefined){
      const val = p.options[selected].value;
      markerPct = Math.min(100, (val/maxVal)*100);
      impactHtml = comparisonFor(screen.id, val);
    } else if(p.multi){
      const val = (selected||[]).reduce((s,oi)=>s+p.options[oi].value,0);
      const maxMulti = p.options.filter(o=>!o.exclusive).reduce((s,o)=>s+o.value,0) || 1;
      markerPct = Math.min(100, (val/maxMulti)*100);
      impactHtml = comparisonFor(screen.id, val);
    }

    return `
      <div class="part-block">
        <div class="q-label">${p.q}</div>
        <div class="options">${optsHtml}</div>
        <div class="gauge-wrap">
          <div class="gauge-label"><span>Your impact gauge</span><span>💧→🔥</span></div>
          <div class="gauge-track"><div class="gauge-marker" style="left:${markerPct}%;"></div></div>
          <div class="gauge-ends"><span>Low use</span><span>High use</span></div>
          <div class="impact-line">${impactHtml}</div>
        </div>
      </div>
    `;
  }).join("");

  const imageHtml = screen.image ? screen.image() : "";

  return `
    <div class="icon-badge">${icon(screen.icon)}</div>
    <div class="eyebrow"><span>${screen.part}</span><span class="line"></span><span>${screen.id==='leaks'?'💧':'📊'}</span></div>
    <h1 class="title">${screen.title}</h1>
    <p class="subtitle">${screen.subtitle}</p>
    ${imageHtml}
    ${partsHtml}
  `;
}

function renderInfoSlide(screen){
  const imageHtml = screen.image ? screen.image() : "";
  return `
    <div class="icon-badge">${icon('globe')}</div>
    <div class="eyebrow"><span>Context</span><span class="line"></span><span>🌍</span></div>
    <h1 class="title">${screen.title}</h1>
    <p class="subtitle">${screen.subtitle}</p>
    ${imageHtml}
    <div>${screen.content}</div>
  `;
}

/* ============ SCORING ============ */
function computeTotals(){
  const directIds = ["bathing","toilet","laundry","kitchen","cleaningOutdoor","leaks"];
  const lifestyleIds = ["diet","clothing","electricity","digital"];

  function sumIds(ids){
    let total = 0;
    ids.forEach(id=>{
      const screen = SCREENS.find(s=>s.id===id);
      const ans = answers[id];
      if(!ans) return;
      screen.parts.forEach((p, pi)=>{
        const sel = ans[pi];
        if(p.multi){
          if(Array.isArray(sel)) sel.forEach(oi => total += p.options[oi].value);
        } else if(sel !== null && sel !== undefined){
          total += p.options[sel].value;
        }
      });
    });
    return total;
  }

  const direct = sumIds(directIds);
  const lifestyle = sumIds(lifestyleIds);
  return {direct, lifestyle, perPerson: direct + lifestyle};
}

const SCORE_POINTS = [ [0,1],[120,2],[250,3],[380,4],[520,5],[700,6],[900,7],[1150,8],[1450,9],[1900,10] ];
function scoreFromTotal(total){
  if(total <= SCORE_POINTS[0][0]) return 1;
  for(let i=1;i<SCORE_POINTS.length;i++){
    const [v0,s0] = SCORE_POINTS[i-1];
    const [v1,s1] = SCORE_POINTS[i];
    if(total <= v1){
      const frac = (total - v0)/(v1 - v0);
      return s0 + frac*(s1-s0);
    }
  }
  return 10;
}
function bandOf(score){
  if(score <= 4) return 0;
  if(score <= 8) return 1;
  return 2;
}
const bandWord = ["In the green — efficient", "Average to high — room to improve", "Excessive — time to act"];
const bandColorVar = ["var(--good)","var(--high)","var(--bad)"];

function tipsFor(band, t){
  const genericByBand = [
    ["You're already in great shape — keep the habits that got you here, like short showers and full-load laundry.",
     "A quick monthly leak-check keeps you in the green — even efficient homes develop small drips over time."],
    ["Fixing even one leak or shortening one shower can visibly move your score — small habits compound fast.",
     "Try switching to bucket bathing or full-load laundry a few days a week instead of every day."],
    ["Your usage is high enough to matter — start with the single biggest number in your breakdown below.",
     "A dripping tap or running flush left for weeks can rival days of bathing water — worth fixing today."]
  ];
  const directTips = [
    "Shorten showers or switch to bucket bathing on a few days a week — an easy 60–100 L/day cut.",
    "Check for leaks today — a single dripping tap ignored for weeks can cost more than a week of bathing.",
    "Wash dishes with a filled basin instead of a running tap — a simple 15–20 L/day saving."
  ];
  const lifestyleTips = [
    "Reduce meat consumption to 1-2x/week — could save 200L+ per day in hidden water.",
    "Buy fewer, longer-lasting clothes — a single pair of jeans hides ~7,500–10,000 L of production water.",
    "Reduce AC hours and heavy appliance use — power plants consume 300-500L per kWh for cooling."
  ];
  const topTips = t.direct >= t.lifestyle ? directTips : lifestyleTips;
  return [...genericByBand[band], topTips[0]];
}

function renderResults(){
  const t = computeTotals();
  const score = scoreFromTotal(t.perPerson);
  const band = bandOf(score);
  const household = Math.round(t.perPerson * familySize);
  const markerPct = Math.min(100, Math.max(0, (score-1)/9*100));
  const tips = tipsFor(band, t);
  
  // India comparison
  const indiaUrban = 135;
  const recommendation = 80;
  const vs_india = Math.round((t.perPerson / indiaUrban) * 100);

  return `
    <div class="icon-badge">${icon('drop')}</div>
    <div class="eyebrow"><span>Your Result</span><span class="line"></span><span>🎉</span></div>
    <h1 class="title">Here's your water footprint</h1>
    ${resultsImage()}

    <div class="score-badge">
      <div>
        <div class="score-num" style="color:${bandColorVar[band]};">${score.toFixed(1)}</div>
        <div class="score-of">out of 10</div>
      </div>
      <div>
        <span class="score-word" style="background:color-mix(in srgb, ${bandColorVar[band]} 22%, transparent); color:${bandColorVar[band]};">${bandWord[band]}</span>
      </div>
    </div>

    <div class="big-gauge">
      <div class="big-gauge-track"><div class="big-gauge-marker" style="left:${markerPct}%;"></div></div>
      <div class="big-gauge-scale"><span>1 · Great</span><span>4</span><span>5</span><span>8</span><span>9 · 10 Excessive</span></div>
    </div>

    <div class="totals-row">
      <div class="total-card">
        <div class="t-emoji">🚿</div>
        <div class="t-label">Per person / day</div>
        <div class="t-value">${Math.round(t.perPerson).toLocaleString()} L</div>
      </div>
      <div class="total-card">
        <div class="t-emoji">🏠</div>
        <div class="t-label">Household / day · ${familySize} ${familySize==1?"person":"people"}</div>
        <div class="t-value">${household.toLocaleString()} L</div>
      </div>
    </div>

    <div class="totals-row">
      <div class="total-card">
        <div class="t-emoji">🇮🇳</div>
        <div class="t-label">vs India Urban Std (135L)</div>
        <div class="t-value" style="color:${vs_india<=100?'var(--good)':vs_india<=150?'var(--high)':'var(--bad)'};">${vs_india}%</div>
      </div>
      <div class="total-card">
        <div class="t-emoji">✅</div>
        <div class="t-label">Recommended Target</div>
        <div class="t-value">${recommendation} L/day</div>
      </div>
    </div>

    <div class="info-box ${vs_india <= 100 ? 'note' : 'alert'}">
      ${vs_india <= 80 ? "🌟 Excellent! You're well below the sustainable target of 80L/day." : 
        vs_india <= 100 ? "✅ Good! You're near India's urban standard. Small changes can make a big difference." :
        vs_india <= 150 ? "⚠️ Above average. Focus on leaks, showers, and food choices." :
        "🔴 High usage. Significant changes needed in multiple areas."}
    </div>

    <div class="tips">
      <div class="tips-label">Priority Actions for You</div>
      ${tips.map(tip=>`<div class="tip">💡 ${tip}</div>`).join("")}
    </div>

    <button class="btn btn-next restart-btn" id="restartBtn">Start over 🔄</button>
  `;
}

/* ============ NAV ============ */
function renderNav(screen){
  if(screen.type === "results"){ navInner.innerHTML = ""; return; }
  const isFirst = current === 0;
  const canProceed = validate(screen);
  navInner.innerHTML = `
    ${isFirst ? "" : `<button class="btn btn-back" id="backBtn">← Back</button>`}
    <button class="btn btn-next" id="nextBtn" ${canProceed ? "" : "disabled"}>${current === SCREENS.length-2 ? "See my result 💧" : (current===0 ? "Begin →" : "Next →")}</button>
  `;
  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.onclick = ()=>{ current--; render(); };
  document.getElementById("nextBtn").onclick = ()=>{ current++; render(); };
}

function validate(screen){
  if(screen.type === "intro") return true;
  if(screen.type === "family") return !!familySize;
  if(screen.type === "info-slide") return true;
  if(screen.type === "question"){
    const ans = answers[screen.id];
    if(!ans) return false;
    return screen.parts.every((p,pi)=>{
      if(p.multi) return Array.isArray(ans[pi]) && ans[pi].length > 0;
      return ans[pi] !== null && ans[pi] !== undefined;
    });
  }
  return true;
}

/* ============ HANDLERS ============ */
function attachHandlers(screen){
  if(screen.type === "family"){
    document.querySelectorAll(".fam-tile").forEach(tile=>{
      tile.onclick = ()=>{
        familySize = tile.dataset.size === "6+" ? 6 : parseInt(tile.dataset.size);
        render();
      };
    });
  }
  if(screen.type === "question"){
    document.querySelectorAll(".option-tile").forEach(tile=>{
      tile.onclick = ()=>{
        const sId = tile.dataset.screen;
        const pIdx = parseInt(tile.dataset.part);
        const oIdx = parseInt(tile.dataset.opt);
        const isMulti = tile.dataset.multi === "1";
        const p = screen.parts[pIdx];

        if(isMulti){
          const opt = p.options[oIdx];
          let arr = answers[sId][pIdx] || [];
          if(opt.exclusive){
            arr = arr.includes(oIdx) ? [] : [oIdx];
          } else {
            arr = arr.filter(i => !p.options[i].exclusive);
            if(arr.includes(oIdx)) arr = arr.filter(i=>i!==oIdx);
            else arr.push(oIdx);
          }
          answers[sId][pIdx] = arr;
        } else {
          answers[sId][pIdx] = oIdx;
        }
        render();
      };
    });
  }
  if(screen.type === "results"){
    const restartBtn = document.getElementById("restartBtn");
    if(restartBtn) restartBtn.onclick = ()=>{
      Object.keys(answers).forEach(k=>delete answers[k]);
      familySize = 1;
      current = 0;
      render();
    };
  }
}

render();
</script>
